name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@10.9.4
      - name: Verify npm matches package.json engine
        run: node -e 'const {engines}=require("./package.json"); const actual=Number(process.versions.npm?.split(".")[0]); const match=engines.npm.match(/^(>=)(\d+)\s+(<)(\d+)$/); if (!match || actual < Number(match[2]) || actual >= Number(match[4])) { console.error(`npm ${process.versions.npm} does not satisfy ${engines.npm}`); process.exit(1); }'
      - run: npm ci
      - run: npm run check:node-engine
      - run: npm run release:check
