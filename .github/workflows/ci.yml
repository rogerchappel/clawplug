name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@10.9.4
      - name: Verify npm matches package.json engine
        run: node -e 'const { engines } = require("./package.json"); const actual = process.env.npm_config_user_agent?.match(/\bnpm\/(\S+)/)?.[1]; const match = engines.npm.match(/^(>=)(\d+)\s+(<)(\d+)$/); const version = Number(actual?.split(".")[0]); if (!match || !Number.isFinite(version) || version < Number(match[2]) || version >= Number(match[4])) { console.error(`npm ${actual ?? "unknown"} does not satisfy ${engines.npm}`); process.exit(1); }'
      - run: npm ci
      - run: npm run check:node-engine
      - run: npm run release:check
